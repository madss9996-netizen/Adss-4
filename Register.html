<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">

</head>

<body style="background-color: aliceblue;">

    <div class="container">
        <div class="row">

            <div class="col-md-6 mt-5 pt-5">
                <img src="img/56f58c5bbae6320e1aa5d36445fd722b.jpg" class="w-75">
            </div>

            <div class="col-md-6 mt-5 pt-5">
                <h2 class="mb-2">Welcome</h2>
                <h6 class="text-muted mb-4">Go ahead and sign up, let everyone <br> know how awesome you are!</h6>
                <h5 id="result"></h5>

                <form onsubmit="return validetData()" action="Success.html" method="post">
                    <input id="user" type="text" name="user" class="form-control mb-4 p-3" placeholder="user name">

                    <input id="email" type="text" name="Email" class="form-control mb-4 p-3" placeholder="Email">

                    <input id="password" type="password" name="password" class="form-control mb-4 p-3"
                        placeholder="password">

                    <input id="confirmPassword" type="password" name="confirmPassword"
                        class="form-control mb-4 p-3" placeholder="confirm password">

                    <input type="submit" value="Create Account" class="btn btn-primary w-100 p-2">
                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="js/main.js"></script>

</html>
